server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must win over the immutable-asset regex below for this one unhashed,
    # runtime-generated file - nginx `location =` always outranks `location ~*`
    # regardless of file order, but keeping it near the top documents that.
    location = /env-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

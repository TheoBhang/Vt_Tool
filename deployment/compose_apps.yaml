services:
  vt-tool-api:
    init: true
    restart: always
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8080
    ports:
      - "127.0.0.1:${VT_TOOL_API_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword}@redis:${REDIS_PORT:-6379}/${VT_TOOL_REDIS_DB:-1}"
      VT_CACHE_DB_URL: "${VT_CACHE_DB_URL:-sqlite:////app/data/vttools.sqlite}"
      VT_CACHE_TTL_HOURS: "${VT_CACHE_TTL_HOURS:-0}"
      CORS_ALLOWED_ORIGINS: "http://localhost:${VT_TOOL_UI_PORT:-5173},http://127.0.0.1:${VT_TOOL_UI_PORT:-5173}"
    volumes:
      - vt_tool_cache:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vt_tool_network

  vt-tool-worker:
    init: true
    restart: always
    command: arq app.worker.settings.WorkerSettings
    env_file:
      - .env
    environment:
      REDIS_URL: "redis://:${REDIS_PASSWORD:-redispassword}@redis:${REDIS_PORT:-6379}/${VT_TOOL_REDIS_DB:-1}"
      VT_CACHE_DB_URL: "${VT_CACHE_DB_URL:-sqlite:////app/data/vttools.sqlite}"
      VT_CACHE_TTL_HOURS: "${VT_CACHE_TTL_HOURS:-0}"
    volumes:
      - vt_tool_cache:/app/data
    healthcheck:
      test: ["CMD-SHELL", "arq app.worker.settings.WorkerSettings --check"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - vt_tool_network

  vt-tool-ui:
    init: true
    restart: always
    ports:
      - "127.0.0.1:${VT_TOOL_UI_PORT:-5173}:80"
    environment:
      VITE_API_BASE: "http://127.0.0.1:${VT_TOOL_API_PORT:-8080}"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - vt_tool_network

networks:
  vt_tool_network:
    external: true
    name: ${NETWORK_NAME}

volumes:
  vt_tool_cache:
